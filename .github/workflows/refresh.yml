name: Refresh market data

on:
  schedule:
    # 22:30 UTC weekdays. That is 5:30pm ET in winter and 6:30pm ET in summer,
    # after the US cash close, so Yahoo has the session print.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: refresh-markets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch EOD snapshot
        env:
          ATLANTIS_API_KEY: ${{ secrets.ATLANTIS_API_KEY }}
        run: python3 scripts/fetch_markets.py

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/markets.json site/data/credit.json
          if git diff --staged --quiet; then
            echo "No change in snapshot"
          else
            asof=$(python3 -c "import json; print(json.load(open('site/data/markets.json'))['asOf'])")
            git commit -m "data: EOD snapshot ${asof}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with this workflow's GITHUB_TOKEN does not start other workflows,
  # so Deploy GitHub Pages would never see the data commit. Publish that commit here.
  deploy:
    needs: refresh
    if: ${{ github.ref == 'refs/heads/main' && needs.refresh.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
